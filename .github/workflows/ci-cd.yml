name: CI/CD Pipeline

# 本 workflow 只执行前端离线门禁并生成短期 build artifact，不发布、不部署。
# 前端 CI 使用已提交的 canonical 契约与权限快照，不依赖后端 checkout。

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22.x'

jobs:
  lint-and-test:
    name: 代码检查与测试
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm run type:check

      - name: ESLint 检查
        run: pnpm run lint:eslint

      - name: Prettier 检查
        run: pnpm run lint:prettier

      - name: Stylelint 检查
        run: pnpm run lint:stylelint

      - name: 单元测试
        run: pnpm test

      - name: 契约不变量测试
        run: pnpm contract:test

      - name: 离线契约同步检查
        run: pnpm contract:verify

      - name: 离线权限同步检查
        run: pnpm permission:verify

  build:
    name: 构建项目
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建生产版本
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
